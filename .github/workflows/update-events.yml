name: Update events

on:
  schedule:
    - cron: "0 11 * * 1"   # every Monday at 11:00 UTC (6 or 7 AM in Indianapolis)
  workflow_dispatch:        # lets you also run it by hand from the Actions tab

permissions:
  contents: write           # allows the job to commit the refreshed files

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # If this fails (for example, zero events found), the job stops here
      # and the live page stays as it was.
      - run: python aggregate_events.py

      - run: python htmlOutput.py

      - name: Publish refreshed page
        run: |
          mkdir -p docs
          cp events.html docs/index.html
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add docs/index.html events.json
          git diff --cached --quiet || git commit -m "Update events $(date -u +%F)"
          git push
